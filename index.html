<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kandang Monyet</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  padding:40px;
}

.container{
  max-width:900px;
  margin:auto;
}

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.tabBtn{
  background:#1e293b;
  color:white;
}

.tabBtn.active{
  background:#ff0050;
}

.tabContent{
  display:none;
}

.tabContent.active{
  display:block;
}

textarea,
input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  box-sizing:border-box;
}

textarea{
  height:140px;
}

button{
  padding:10px 18px;
  border:none;
  border-radius:8px;
  margin-top:10px;
  cursor:pointer;
}

.convert{background:#ff0050;color:white}
.downloadAll{background:#22c55e;color:white}
.reset{background:#64748b;color:white}
.searchBtn{background:#38bdf8;color:#0f172a}

button:disabled{
  opacity:0.4;
  cursor:not-allowed;
}

.globalActions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
  margin-top:12px;
  margin-bottom:15px;
}

.globalActions button{
  margin-top:0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
  margin-top:25px;
}

.card{
  background:#1e293b;
  padding:12px;
  border-radius:12px;
}

video{
  width:100%;
  border-radius:8px;
}

.title{
  font-size:13px;
  margin-top:6px;
  color:#ccc;

  display:-webkit-box;
  line-clamp:2;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.title.expanded{
  line-clamp:unset;
  -webkit-line-clamp:unset;
}

.moreBtn{
  font-size:12px;
  color:#38bdf8;
  cursor:pointer;
  margin-top:4px;
  display:inline-block;
}

.id{
  font-size:12px;
  color:#aaa;
  margin-top:5px;
}

.status{
  font-size:12px;
  color:#facc15;
  margin-top:5px;
}

.downloadBtn{
  width:100%;
  margin-top:10px;
  padding:8px;
  border:none;
  border-radius:6px;
  background:#22c55e;
  color:white;
}

.downloadBtn.done{
  background:#64748b;
}

.report{
  margin-top:20px;
  padding:12px;
  border-radius:10px;
  background:#1e293b;
  font-size:14px;
}

@media(max-width:600px){
  body{
    padding:20px;
  }

  .globalActions button,
  .tabs button{
    flex:1;
  }
}
</style>
</head>

<body>

<div class="container">

<h2>TikTok Bulk Downloader</h2>

<div class="tabs">
  <button class="tabBtn active" data-tab="bulkTab">Bulk URL</button>
  <button class="tabBtn" data-tab="searchTab">Search</button>
  <button class="tabBtn" data-tab="userFeedTab">User Feed</button>
  <button class="tabBtn" data-tab="trendingTab">Trending</button>
</div>

<div id="bulkTab" class="tabContent active">
  <textarea id="links" placeholder="Paste TikTok links or IDs"></textarea>
</div>

<div id="searchTab" class="tabContent">
  <input id="searchInput" placeholder="Search TikTok videos, e.g. funny cat, motorcycle, cooking">
</div>

<div id="userFeedTab" class="tabContent">
  <input id="userInput" placeholder="TikTok username, e.g. davinakaramoy or @davinakaramoy">
</div>

<div id="trendingTab" class="tabContent">
  <input id="regionInput" value="ID" placeholder="Country code, e.g. ID, US, JP, KR">
</div>

<div class="globalActions">
  <button id="generateBtn" class="convert primaryAction" disabled>Generate Videos</button>
  <button id="searchBtn" class="searchBtn primaryAction">Search</button>
  <button id="userFeedBtn" class="searchBtn primaryAction">Load User Feed</button>
  <button id="trendingBtn" class="searchBtn primaryAction">Load Trending</button>

  <button id="downloadAllBtn" class="downloadAll" disabled>Download All</button>
  <button id="resetBtn" class="reset" disabled>Reset</button>
</div>

<div id="report" class="report" style="display:none"></div>

<div id="videos" class="grid"></div>

</div>

<script>
const API_BASE = "https://jangkrikan101-kandang.hf.space";

let videos = [];
let successCount = 0;
let failedIds = [];

const textarea = document.getElementById("links");
const generateBtn = document.getElementById("generateBtn");
const downloadAllBtn = document.getElementById("downloadAllBtn");
const resetBtn = document.getElementById("resetBtn");
const report = document.getElementById("report");

const searchInput = document.getElementById("searchInput");
const searchBtn = document.getElementById("searchBtn");
const userInput = document.getElementById("userInput");
const userFeedBtn = document.getElementById("userFeedBtn");
const regionInput = document.getElementById("regionInput");
const trendingBtn = document.getElementById("trendingBtn");

function updateActionButtons(activeTab){
  generateBtn.style.display = activeTab === "bulkTab" ? "inline-block" : "none";
  searchBtn.style.display = activeTab === "searchTab" ? "inline-block" : "none";
  userFeedBtn.style.display = activeTab === "userFeedTab" ? "inline-block" : "none";
  trendingBtn.style.display = activeTab === "trendingTab" ? "inline-block" : "none";
}

document.querySelectorAll(".tabBtn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".tabBtn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tabContent").forEach(t => t.classList.remove("active"));

    btn.classList.add("active");

    const activeTab = btn.dataset.tab;
    document.getElementById(activeTab).classList.add("active");

    updateActionButtons(activeTab);
  };
});

updateActionButtons("bulkTab");

textarea.addEventListener("input", () => {
  generateBtn.disabled = textarea.value.trim() === "";
});

searchInput.addEventListener("keydown", e => {
  if(e.key === "Enter") searchVideos();
});

regionInput.addEventListener("keydown", e => {
  if(e.key === "Enter") loadTrending();
});

userFeedBtn.onclick = loadUserFeed;

async function loadUserFeed(){
  const username = userInput.value.trim();

  if(!username) return;

  const container = document.getElementById("videos");
  container.innerHTML = "";

  videos = [];
  successCount = 0;
  failedIds = [];

  report.style.display = "block";
  report.innerHTML = "Loading user feed...";

  userFeedBtn.disabled = true;
  userFeedBtn.innerText = "Loading...";

  try{
    const res = await fetch(`${API_BASE}/user-feed?unique_id=${encodeURIComponent(username)}&count=20`);
    const json = await res.json();

    let items = [];

    if(Array.isArray(json.data?.videos)){
      items = json.data.videos;
    } else if(Array.isArray(json.data)){
      items = json.data;
    } else if(Array.isArray(json.videos)){
      items = json.videos;
    }

    if(!items.length){
      report.innerHTML = "No user feed videos found.";
      return;
    }

    items.forEach(item => {
      const card = createVideoCard(item);
      container.appendChild(card);
    });

    report.innerHTML = `
      <b>User Feed Report</b><br>
      User: ${username}<br>
      Results: ${items.length}
    `;

    downloadAllBtn.disabled = videos.length === 0;
    resetBtn.disabled = false;
  }
  catch(e){
    console.error(e);
    report.innerHTML = "Failed to load user feed.";
  }
  finally{
    userFeedBtn.disabled = false;
    userFeedBtn.innerText = "Load User Feed";
  }
}

userInput.addEventListener("keydown", e => {
  if(e.key === "Enter") loadUserFeed();
});

function sleep(ms){
  return new Promise(r => setTimeout(r, ms));
}

function extractVideoId(input){
  input = input.trim();

  if (/^\d+$/.test(input)) return input;

  let match = input.match(/video\/(\d+)/);
  if (match) return match[1];

  return null;
}

function cleanFilename(name){
  return String(name || "tiktok-video")
    .replace(/[\\/:*?"<>|]/g, "")
    .substring(0, 80);
}

function getVideoId(item){
  return (
    item.id ||
    item.aweme_id ||
    item.video_id ||
    item.video?.id ||
    item.video?.aweme_id ||
    item.statistics?.aweme_id ||
    ""
  );
}

function getPlayableUrl(item){
  const id = item.id || item.aweme_id;

  // Force TikWM media URL when ID exists
  if(id){
    return `https://tikwm.com/video/media/play/${id}.mp4`;
  }

  // Fallback for Search / Trending
  return item.play || item.wmplay || item.hdplay || item.url || "";
}

function createVideoCard(item){
  const id =
  item.id ||
  item.aweme_id ||
  item.video_id ||
  item.video?.id ||
  item.video?.aweme_id ||
  item.statistics?.aweme_id ||
  "unknown";
  const title = item.title || item.desc || id;
  const videoUrl = getPlayableUrl(item);

  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <video controls src="${videoUrl}"></video>

    <button class="downloadBtn">Download</button>

    <div class="id">ID: ${id}</div>

    <div class="title">${title}</div>
    <div class="moreBtn">More</div>
    <div class="status">${videoUrl ? "Ready" : "No video URL"}</div>
  `;

  const moreBtn = card.querySelector(".moreBtn");
  moreBtn.onclick = () => {
    const titleEl = card.querySelector(".title");
    titleEl.classList.toggle("expanded");
    moreBtn.innerText = titleEl.classList.contains("expanded") ? "Less" : "More";
  };

  const safeTitle = cleanFilename(title);

  const videoData = {
    id,
    title: safeTitle,
    url: videoUrl
  };

  if (videoUrl) {
    videos.push(videoData);
    card.querySelector(".downloadBtn").onclick = () => {
      downloadVideo(card.querySelector(".downloadBtn"), videoData);
    };
  } else {
    card.querySelector(".downloadBtn").disabled = true;
  }

  return card;
}

async function fetchVideoData(id, card, retry = 0){
  const status = card.querySelector(".status");
  const titleEl = card.querySelector(".title");
  const videoEl = card.querySelector("video");
  const btn = card.querySelector(".downloadBtn");

  const tiktokUrl = `https://www.tiktok.com/@user/video/${id}`;
  const api = `${API_BASE}/video?url=${encodeURIComponent(tiktokUrl)}`;

  try{
    status.innerText = "Loading...";

    const res = await fetch(api);
    const json = await res.json();

    if (!json.data) throw "No data";

    const data = json.data;
    const title = data.title || id;
    const videoUrl = getPlayableUrl(data);

    titleEl.innerText = title;
    videoEl.src = videoUrl;

    const videoData = {
      id,
      title: cleanFilename(title),
      url: videoUrl
    };

    videos.push(videoData);

    btn.onclick = () => downloadVideo(btn, videoData);

    status.innerText = "Ready";
    successCount++;
  }
  catch(e){
    if(retry < 2){
      status.innerText = "Retrying...";
      await sleep(1200);
      return fetchVideoData(id, card, retry + 1);
    }

    status.innerText = "Failed";
    failedIds.push(id);
  }
}

generateBtn.onclick = convert;

async function convert(){
  generateBtn.innerText = "Cooking...";
  generateBtn.disabled = true;

  videos = [];
  successCount = 0;
  failedIds = [];

  const lines = textarea.value.split("\n").filter(x => x.trim() !== "");

  const total = lines.length;
  let current = 0;

  const container = document.getElementById("videos");
  container.innerHTML = "";

  for(const line of lines){
    const id = extractVideoId(line);

    if(!id) continue;

    current++;
    updateReport(current, total);

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <video controls></video>

      <button class="downloadBtn">Download</button>

      <div class="id">ID: ${id}</div>

      <div class="title">Title: ...</div>
      <div class="moreBtn">More</div>
      <div class="status">Waiting...</div>
    `;

    container.prepend(card);

    await fetchVideoData(id, card);

    const moreBtn = card.querySelector(".moreBtn");

    moreBtn.onclick = () => {
      const title = card.querySelector(".title");
      title.classList.toggle("expanded");

      moreBtn.innerText =
        title.classList.contains("expanded") ? "Less" : "More";
    };

    updateReport(current, total);

    await sleep(600);
  }

  generateBtn.innerText = "Ready";

  downloadAllBtn.disabled = videos.length === 0;
  resetBtn.disabled = false;

  updateReport(total, total);
}

function updateReport(current, total){
  report.style.display = "block";

  report.innerHTML = `
    <b>Live Report</b><br>

    Generating video ${current} of ${total}<br><br>

    Successful: ${successCount}<br>

    Failed: ${failedIds.length}<br>

    Failed IDs: ${failedIds.length ? failedIds.join(", ") : "None"}
  `;
}

searchBtn.onclick = searchVideos;

async function searchVideos(){
  const q = searchInput.value.trim();

  if(!q) return;

  const container = document.getElementById("videos");
  container.innerHTML = "";

  videos = [];
  successCount = 0;
  failedIds = [];

  report.style.display = "block";
  report.innerHTML = "Searching...";

  searchBtn.disabled = true;
  searchBtn.innerText = "Searching...";

  try{
    const res = await fetch(`${API_BASE}/search?q=${encodeURIComponent(q)}&count=20`);
    const json = await res.json();

    let items = [];

    if(Array.isArray(json.data?.videos)){
      items = json.data.videos;
    } else if(Array.isArray(json.data)){
      items = json.data;
    } else if(Array.isArray(json.videos)){
      items = json.videos;
    }

    if(!items.length){
      report.innerHTML = "No results found.";
      return;
    }

    items.forEach(item => {
      const card = createVideoCard(item);
      container.appendChild(card);
    });

    report.innerHTML = `
      <b>Search Report</b><br>
      Query: ${q}<br>
      Results: ${items.length}
    `;

    downloadAllBtn.disabled = videos.length === 0;
    resetBtn.disabled = false;
  }
  catch(e){
    console.error(e);
    report.innerHTML = "Search failed. Check FastAPI terminal or CORS.";
  }
  finally{
    searchBtn.disabled = false;
    searchBtn.innerText = "Search";
  }
}

trendingBtn.onclick = loadTrending;

async function loadTrending(){
  const region = regionInput.value.trim() || "ID";

  const container = document.getElementById("videos");
  container.innerHTML = "";

  videos = [];
  successCount = 0;
  failedIds = [];

  report.style.display = "block";
  report.innerHTML = "Loading trending videos...";

  trendingBtn.disabled = true;
  trendingBtn.innerText = "Loading...";

  try{
    const res = await fetch(`${API_BASE}/trending?region=${encodeURIComponent(region)}&count=20`);
    const json = await res.json();

    let items = [];

    if(Array.isArray(json.data?.videos)){
      items = json.data.videos;
    } else if(Array.isArray(json.data)){
      items = json.data;
    } else if(Array.isArray(json.videos)){
      items = json.videos;
    }

    if(!items.length){
      report.innerHTML = "No trending videos found.";
      return;
    }

    items.forEach(item => {
      const card = createVideoCard(item);
      container.appendChild(card);
    });

    report.innerHTML = `
      <b>Trending Report</b><br>
      Region: ${region.toUpperCase()}<br>
      Results: ${items.length}
    `;

    downloadAllBtn.disabled = videos.length === 0;
    resetBtn.disabled = false;
  }
  catch(e){
    console.error(e);
    report.innerHTML = "Failed to load trending videos.";
  }
  finally{
    trendingBtn.disabled = false;
    trendingBtn.innerText = "Load Trending";
  }
}

async function downloadVideo(button, video){
  if(button.classList.contains("done")) return;

  button.innerText = "Downloading...";
  button.disabled = true;

  try{
    const res = await fetch(video.url);
    const blob = await res.blob();

    const blobUrl = URL.createObjectURL(blob);

    const a = document.createElement("a");

    a.href = blobUrl;
    a.download = video.title + ".mp4";

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(blobUrl);

    button.innerText = "Downloaded";
    button.classList.add("done");
  }
  catch(e){
    button.innerText = "Failed";
    button.disabled = false;
  }
}

downloadAllBtn.onclick = downloadAllVideos;

async function downloadAllVideos(){
  if(videos.length === 0) return;

  const buttons = document.querySelectorAll(".downloadBtn");

  const total = buttons.length;
  let current = 0;

  downloadAllBtn.disabled = true;

  for(let i = 0; i < buttons.length; i++){
    const btn = buttons[i];

    if(btn.classList.contains("done")){
      current++;
      continue;
    }

    current++;

    downloadAllBtn.innerText = `Downloading ${current} / ${total}`;

    btn.click();

    await sleep(1500);
  }

  downloadAllBtn.innerText = "Downloaded";
}

resetBtn.onclick = resetAll;

function resetAll(){
  textarea.value = "";
  searchInput.value = "";
  regionInput.value = "ID";

  const container = document.getElementById("videos");
  container.innerHTML = "";

  videos = [];
  successCount = 0;
  failedIds = [];

  report.style.display = "none";
  report.innerHTML = "";

  generateBtn.innerText = "Generate Videos";
  generateBtn.disabled = true;

  searchBtn.innerText = "Search";
  searchBtn.disabled = false;

  trendingBtn.innerText = "Load Trending";
  trendingBtn.disabled = false;

  downloadAllBtn.innerText = "Download All";
  downloadAllBtn.disabled = true;

  resetBtn.disabled = true;
}
</script>

</body>
</html>
